name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  poccore-tests:
    name: POCCore swift test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run POCCore tests
        run: cd KadrPOC && swift test

  app-build:
    name: Build JangyPOC app (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build app
        run: |
          xcodebuild -project App/JangyPOC/JangyPOC.xcodeproj -scheme JangyPOC \
            -destination 'generic/platform=iOS Simulator' build
