name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  jangycore-tests:
    name: JangyCore swift test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run JangyCore tests
        run: cd Packages/JangyCore && swift test

  app-build:
    name: Build Jangy app (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build app
        run: |
          xcodebuild -project Jangy.xcodeproj -scheme Jangy \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation build
